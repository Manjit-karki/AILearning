# spring AI core
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=[URL]]
spring.ai.ollama.chat.model=qwen2.5:1.5b
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.vectorstore.mongodb.initialize-schema=false

# core
spring.application.name=Backend

# Database
spring.data.mongodb.uri={SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/backend}
# Spring security
spring.security.user.name=${SPRING_SECURITY_USER:admin}
spring.security.user.password=${SPRING_SECURITY_PASSWORD:admin}
server.port=8081
debug=false